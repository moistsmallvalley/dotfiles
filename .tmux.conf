# Change prefix Ctrl-b -> Ctrl-q
unbind C-b
set -g prefix C-q
bind C-q send-prefix

# Move between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Split panes
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Resize panes
bind -r H resize-pane -L 15
bind -r J resize-pane -D 15
bind -r K resize-pane -U 15
bind -r L resize-pane -R 15

# Mouse
set -g mouse on

# Vim copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-no-clear "pbcopy"
# マウスでドラッグ選択してもコピーモードを抜けない（スクロール位置を保持）
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear "pbcopy"

# Reload settings
bind r source-file ~/.tmux.conf \; display-message "tmux.conf relaoded"

# Extended keys (CSI u) — Shift+Enter などをアプリに渡す
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Window を閉じたら番号を詰める
set -g renumber-windows on

# ステータスバー（Powerline 風の矢印 + Nord 配色。Ghostty が矢印を自前で描画する）
# Nord: nord0 #2E3440 / nord1 #3B4252 / nord3 #4C566A / nord4 #D8DEE9 / nord8 #88C0D0 / nord9 #81A1C1 / nord13 #EBCB8B
set -as terminal-features ',xterm*:RGB'
set -g status-interval 5
set -g status-style bg=#3B4252,fg=#D8DEE9

# 左: 普段は今のプログラム名、prefix を押している間だけ黄色で PREFIX と出す
# （Claude Code はプロセス名がバージョン番号になるので claude と表示）
set -g status-left "#[fg=#2E3440,bold]#{?client_prefix,#[bg=#EBCB8B],#[bg=#81A1C1]}#{?client_prefix, PREFIX , #{?#{m/r:^[0-9.]+$,#{pane_current_command}},claude,#{pane_current_command}} }#[bg=#3B4252,nobold]#{?client_prefix,#[fg=#EBCB8B],#[fg=#81A1C1]} "
set -g status-left-length 30

# 右: 今のペインの git ブランチ（リポジトリ外では非表示）と時刻
set -g status-right "#[fg=#4C566A,bg=#3B4252]#[fg=#D8DEE9,bg=#4C566A] #(cd #{q:pane_current_path} && git branch --show-current 2>/dev/null | sed 's/.*/ &   /')%m/%d %H:%M "
set -g status-right-length 60

# タブ: 最大化中（prefix + z）は 🔍 を付ける
set -g window-status-separator ''
set -g window-status-format "#[fg=#3B4252,bg=#4C566A]#[fg=#D8DEE9,bg=#4C566A] #I  #W#{?window_zoomed_flag, 🔍,} #[fg=#4C566A,bg=#3B4252]"
set -g window-status-current-format "#[fg=#3B4252,bg=#88C0D0]#[fg=#2E3440,bg=#88C0D0,bold] #I  #W#{?window_zoomed_flag, 🔍,} #[fg=#88C0D0,bg=#3B4252,nobold]"
